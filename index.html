<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="images/Logo.png" />

  <body>
    <section class="poppins container">

          <div id="child_content" class="dropdown-content">
            <ul class="sm-menu menu">
              <li><a href="#navbar">Home</a></li>
              <li class="dropdown-2">
                <a id="nested_dropdown_btn" class="dropbtn">
                  Service <i class="fa-solid fa-angle-down"></i>
                </a>
                <div id="nested_child_content" class="dropdown-content-2">
                  <a href="#">Service 1</a>
                  <a href="#">Service 2</a>
                  <a href="#">Service 3</a>
                </div>
              </li>
              <li><a href="#">Portfolio</a></li>

              <li><a href="#">Pricing</a></li>

        <a href="#navbar"

        <ul class="menu lg-menu">

          <li class="dropdown">
            <a class="dropbtn">
              Service <i class="fa-solid fa-angle-down"></i>
            </a>
            <div class="dropdown-content">
              <a href="#">Service 1</a>
              <a href="#">Service 2</a>
              <a href="#">Service 3</a>
            </div>
          </li>
          <li><a href="#">Portfolio</a></li>
          <li><a href="#">Reviews</a></li>
          <li><a href="#">Pricing</a></li>
          <li><a href="#">White Level</a></li>
        </ul>
        <div class="nav-btn-container">
          <button class="btn-gray">Log in</button>
          <button class="btn-purple">Book a demo</button>
        </div>
      </nav>
    </section>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/js/all.min.js"
      integrity="sha512-b+nQTCdtTBIRIbraqNEwsjB6UvL3UEMkXnhzd8awtCYh0Kcsjl9uEgwVFVbhoj3uu1DO1ZMacNvLoyJJiNfcvg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="app.js"></script>
